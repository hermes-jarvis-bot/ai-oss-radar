services:
  radar:
    build: .
    image: ai-oss-radar:local
    env_file:
      - path: .env
        required: false
    volumes:
      - ${RADAR_DATA_DIR:-./data}:/data
    working_dir: /app
    command: ["run", "--db", "/data/radar.db", "--reports-dir", "/data/reports", "--delivery-mode", "stdout"]
    restart: "no"

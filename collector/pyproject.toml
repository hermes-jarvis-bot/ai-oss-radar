[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-oss-radar"
version = "0.4.0"
description = "Daily radar for viral AI open-source developer tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
ai-oss-radar = "ai_oss_radar.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
